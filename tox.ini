# Local test runner for ELNBuildSync.
#
# `unit` and `integration` both need the same system (dnf-installed)
# packages as Dockerfile/.github/workflows/*.yml -- e.g. python3-rpm,
# python3-krb5, python3-gssapi, python3-twisted, koji, bodhi-client,
# fedora-messaging -- none of which are reasonably pip-installable.
# `sitepackages = true` lets each tox venv see those, while tox still
# installs this project (editable) and its lightweight `test` extra
# (pytest/pytest-asyncio, from pyproject.toml) into the venv itself.
#
# Usage:
#   tox                  # unit, then integration
#   tox -e unit          # fast, no external services required
#   tox -e integration   # spins up an ephemeral Postgres container; needs
#                        # podman or docker on PATH (see
#                        # tests/integration/run_local.sh)

[tox]
envlist = unit, integration
skip_missing_interpreters = true

[testenv]
sitepackages = true
package = editable
extras = test

[testenv:unit]
description = Run the non-integration unit test suite.
commands = pytest tests -m "not integration" {posargs}

[testenv:integration]
description =
    Run the end-to-end integration suite (tests/integration/), against a
    disposable Postgres container managed by run_local.sh.
allowlist_externals = bash
passenv =
    HOME
    XDG_RUNTIME_DIR
    DBUS_SESSION_BUS_ADDRESS
    ELNBUILDSYNC_TEST_DB_PORT
commands = bash {toxinidir}/tests/integration/run_local.sh {posargs}
