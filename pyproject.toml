[project]
name = "ELNBuildSync"
version = "2.0.2"
authors  = [
    { name = "Stephen Gallagher", email = "sgallagh@redhat.com" },
]

description = "A tool to automatically rebuild Fedora Rawhide packages for Fedora ELN"

readme = "README.md"

requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Framework :: Twisted",
    "Topic :: System :: Software Distribution",
]


[project.urls]
"Homepage" = "https://docs.fedoraproject.org/en-US/eln/"
"Bug Tracker" = "https://github.com/fedora-eln/eln/issues"


[project.scripts]
elnbuildsync = "elnbuildsync:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that fake Koji/Bodhi/Fedora Messaging and require a real Postgres database (see tests/integration/).",
]

[build-system]
requires = ["setuptools >= 40.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elnbuildsync*"]

[tool.setuptools.package-data]
elnbuildsync = ["templates/status.html", "static/*"]

[tool.ruff.lint]
ignore = ["BLE001", "RUF100"]
# Ruff <0.16 flags intentional post-bootstrap imports in __init__.py (E402).
per-file-ignores = { "elnbuildsync/__init__.py" = ["E402"] }

[tool.ruff.lint.isort]
known-first-party = ["elnbuildsync"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern relies on calling Depends(...) (and
# similar) in argument defaults; that's not the mutable-default footgun B008
# looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
