name: Integration Tests

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: elnbuildsync
  ELNBUILDSYNC_TEST_DB_URL: postgresql+asyncpg://elnbuildsync:elnbuildsync@postgres:5432/elnbuildsync

jobs:
  pytest-integration:
    name: Pytest (integration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: quay.io/fedora/fedora:44
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elnbuildsync
          POSTGRES_PASSWORD: elnbuildsync
          POSTGRES_DB: elnbuildsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          INSTALL_PKGS=" \
            bash \
            bodhi-client \
            fedora-messaging \
            koji \
            krb5-workstation \
            python3-cachetools \
            python3-click \
            python3-fastapi \
            python3-GitPython \
            python3-gssapi \
            python3-httpx \
            python3-krb5 \
            python3-pip \
            python3-pyyaml \
            python3-requests \
            python3-rpm \
            python3-sqlalchemy+postgresql_asyncpg \
            python3-tenacity \
            python3-twisted \
            python3-uvicorn \
            python3-virtualenv \
            " && \
          dnf -y --setopt=tsflags=nodocs install $INSTALL_PKGS && \
          dnf -y clean all --enablerepo='*'
          pip install -e ".[test]"
      - name: Run integration pytest
        run: pytest tests -m integration
